name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.0 pyright==1.1.414
      - name: Lint
        run: ruff check .
      - name: Type-check against stubs/dsc.pyi
        run: pyright
      - name: Plugin manifests
        run: python scripts/check_plugins.py
